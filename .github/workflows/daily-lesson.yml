name: Generate Daily German Lesson

on:
  schedule:
    # 2:00 AM UTC = 4:00 AM Poland Time (Summer) / 3:00 AM Poland Time (Winter)
    - cron: '0 2 * * *'
  workflow_dispatch: # This allows you to click a "Run Workflow" button manually in GitHub

permissions:
  contents: write # Important: Gives the action permission to push code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi google-genai beautifulsoup4 feedparser

      - name: Run Scraper and AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_lesson.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/
          # This checks if there are changes. If yes, it commits and pushes. If no, it does nothing.
          git diff --staged --quiet || (git commit -m "Auto-added new German lesson $(date +'%Y-%m-%d')" && git push)
