<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Lernen — Portal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font:      "Segoe UI", system-ui, -apple-system, sans-serif;
  --teal-900:  #005A5A;
  --teal-700:  #008282;
  --teal-400:  #50C1C1;
  --teal-100:  #95DFDB;
  --amber:     #E1A01E;
  --ink:       #012D2C;
  --text:      #005A5A;
  --text-muted:#008282;
  --page:      #F0FAFA;
  --card:      #FFFFFF;
  --in:        #F0FAFA;
  --border:    #D0ECEB;
  --shadow:    0 1px 4px rgba(1,45,44,.10);
  --shadow-md: 0 4px 14px rgba(1,45,44,.12);
  --r:         8px;
}
[data-theme="dark"] {
  --text:       #95DFDB;
  --text-muted: #50C1C1;
  --page:       #012D2C;
  --card:       #032F2E;
  --in:         #021E1E;
  --border:     #0A5050;
  --shadow:     0 4px 14px rgba(0,0,0,.40);
  --shadow-md:  0 6px 20px rgba(0,0,0,.50);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font); color: var(--text); background: var(--page);
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  transition: background 200ms, color 200ms;
  -webkit-font-smoothing: antialiased;
}

/* ── NAVBAR ─────────────────────────────────────────── */
.navbar {
  display: flex; align-items: center; height: 48px; padding: 0 28px;
  background: var(--teal-900); border-bottom: 1px solid rgba(149,223,219,.15);
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
}
.brand-icon { display: flex; align-items: center; text-decoration: none; }
.nav-pipe { width: 1px; height: 16px; background: rgba(149,223,219,.30); margin: 0 12px; }
.nav-brand-text { font-size: 1rem; font-weight: 600; color: var(--teal-100); text-decoration: none; }
.nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn {
  font-family: var(--font); font-size: 0.8125rem; font-weight: 500;
  color: rgba(149,223,219,.85); background: rgba(149,223,219,.12);
  border: 1px solid rgba(149,223,219,.22); border-radius: 4px;
  padding: 5px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: 130ms; white-space: nowrap;
}
.icon-btn:hover { background: rgba(149,223,219,.22); border-color: rgba(149,223,219,.40); color: var(--teal-100); }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }

/* ── HERO ───────────────────────────────────────────── */
.hero {
  max-width: 1040px; margin: 0 auto; padding: 48px 20px 8px; width: 100%;
}
.hero-eyebrow {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--teal-700); margin-bottom: 10px;
}
[data-theme="dark"] .hero-eyebrow { color: var(--teal-400); }
.hero h1 {
  font-size: 2.1rem; font-weight: 700; color: var(--teal-900);
  line-height: 1.15; margin-bottom: 12px; letter-spacing: -.02em;
}
[data-theme="dark"] .hero h1 { color: var(--teal-100); }
.hero p { font-size: 1rem; color: var(--text-muted); max-width: 56ch; line-height: 1.6; }

/* ── MODULE GRID ────────────────────────────────────── */
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; width: 100%; flex: 1; }
.section-header {
  font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--teal-700); border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 16px;
}
[data-theme="dark"] .section-header { color: var(--teal-400); }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.module-card {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 18px 20px; box-shadow: var(--shadow);
  transition: border-color 130ms, box-shadow 130ms, transform 130ms;
}
.module-card:hover { border-color: var(--teal-400); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.module-card:disabled, .module-card.locked { opacity: .58; cursor: default; }
.module-card:disabled:hover, .module-card.locked:hover { transform: none; border-color: var(--border); box-shadow: var(--shadow); }

.module-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.module-icon {
  width: 38px; height: 38px; border-radius: var(--r); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--in); border: 1px solid var(--border); color: var(--teal-700);
}
.module-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[data-theme="dark"] .module-icon { color: var(--teal-400); }

.module-status {
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 3px 8px; border-radius: 12px; white-space: nowrap;
}
.module-status.live { background: rgba(0,130,130,.10); color: var(--teal-700); }
.module-status.soon { background: rgba(225,160,30,.15); color: var(--amber); }
[data-theme="dark"] .module-status.live { background: rgba(80,193,193,.15); color: var(--teal-400); }
[data-theme="dark"] .module-status.soon { color: var(--amber); }

.module-card h2 { font-size: 1.05rem; font-weight: 700; color: var(--teal-900); margin-bottom: 5px; }
[data-theme="dark"] .module-card h2 { color: var(--teal-100); }
.module-card p { font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; }
.module-go { display: inline-flex; align-items: center; gap: 5px; margin-top: 12px; font-size: 0.75rem; font-weight: 700; color: var(--teal-700); text-transform: uppercase; letter-spacing: .05em; }
[data-theme="dark"] .module-go { color: var(--teal-400); }
.module-card:disabled .module-go { color: var(--text-muted); }
.module-go svg { width: 12px; height: 12px; fill: currentColor; }

/* ── TOASTER ────────────────────────────────────────── */
#toast-container { position: fixed; bottom: 24px; left: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: flex-start; gap: 10px; min-width: 260px; max-width: 360px;
  padding: 11px 14px; border-radius: 6px; font-size: 0.8125rem; line-height: 1.45;
  box-shadow: 0 4px 18px rgba(1,45,44,.18); pointer-events: all; position: relative; overflow: hidden;
  animation: toast-in 200ms cubic-bezier(.22,1,.36,1) forwards;
}
.toast.removing { animation: toast-out 180ms ease-in forwards; }
@keyframes toast-in  { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toast-out { from { opacity: 1; transform: translateY(0); max-height: 60px; } to { opacity: 0; transform: translateY(12px); max-height: 0; margin-bottom: -8px; } }
.toast-info  { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.toast-body { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.8125rem; }
.toast-msg   { font-size: 0.75rem; opacity: .85; margin-top: 1px; }
.toast-close { background: none; border: none; cursor: pointer; color: inherit; opacity: .6; font-size: 1rem; line-height: 1; padding: 0; }
.toast-progress { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--teal-400); animation: toast-shrink linear forwards; }
@keyframes toast-shrink { from { width: 100%; } to { width: 0%; } }

/* ── FOOTER ─────────────────────────────────────────── */
.footer {
  max-width: 1040px; margin: 0 auto; width: 100%;
  border-top: 1px solid var(--border); padding: 12px 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8125rem; color: var(--text-muted); flex-shrink: 0;
}
.footer strong { color: var(--text); font-weight: 600; }
.footer-dot { margin: 0 10px; color: var(--border); }
</style>
</head>
<body>

<div id="toast-container"></div>

<nav class="navbar">
  <a class="brand-icon" href="./" aria-label="Deutsch Lernen home">
    <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
    </svg>
  </a>
  <div class="nav-pipe"></div>
  <a class="nav-brand-text" href="./">Deutsch Lernen</a>
  <div class="nav-actions">
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">Dark</button>
  </div>
</nav>

<section class="hero">
  <div class="hero-eyebrow">Learning Portal</div>
  <h1>Deutsch lernen</h1>
  <p>Pick a module below. Each one is self-contained and saves your progress to your own GitHub.</p>
</section>

<div class="wrap">
  <div class="section-header">Modules</div>
  <div class="module-grid" id="moduleGrid"></div>
</div>

<footer class="footer">
  <span><strong>Deutsch Lernen</strong></span>
  <span class="footer-dot">·</span>
  <span>Roman Zajic</span>
</footer>

<script>
/* ── MODULE REGISTRY ─────────────────────────────────────
   Add an entry here to publish a new module. `status` is
   "live" (clickable) or "soon" (rendered as a locked card).
   `path` is relative to this index.html.
────────────────────────────────────────────────────────── */
const MODULES = [
  {
    id: 'vocabulary',
    title: 'Vocabulary',
    blurb: 'Build and drill your word list. Review mode, two-way self-testing, lookup from the German-English dictionary, and GitHub sync.',
    status: 'live',
    path: 'modules/vocabulary/',
    icon: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`
  },
  {
    id: 'grammar',
    title: 'Grammar',
    blurb: 'Cases, verb conjugation, and sentence structure explained in plain language with worked examples.',
    status: 'soon',
    path: '#',
    icon: `<svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>`
  },
  {
    id: 'listening',
    title: 'Listening',
    blurb: 'Audio exercises with comprehension questions, at a pace that matches your level.',
    status: 'soon',
    path: '#',
    icon: `<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`
  },
  {
    id: 'writing',
    title: 'Writing',
    blurb: 'Guided composition with corrections on cases, gender, and word order.',
    status: 'soon',
    path: '#',
    icon: `<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`
  }
];

const ARROW = `<svg viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.71 12l-7.86-7.86-1.42 1.42L16.86 11H5v2z"/></svg>`;

function renderModules() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = '';

  MODULES.forEach(m => {
    const live = m.status === 'live';
    const el = document.createElement(live ? 'a' : 'div');
    el.className = 'module-card' + (live ? '' : ' locked');
    if (live) el.href = m.path;
    el.innerHTML = `
      <div class="module-top">
        <span class="module-icon">${m.icon}</span>
        <span class="module-status ${live ? 'live' : 'soon'}">${live ? 'Ready' : 'Soon'}</span>
      </div>
      <h2>${m.title}</h2>
      <p>${m.blurb}</p>
      <span class="module-go">${live ? 'Open module' : 'In development'} ${live ? ARROW : ''}</span>`;
    grid.appendChild(el);
  });
}

/* ── TOAST ──────────────────────────────────────────── */
function toast(title, msg, duration) {
  const dur = duration || 4000;
  const el = document.createElement('div');
  el.className = 'toast toast-info';
  el.innerHTML = '<div class="toast-body"><div class="toast-title"></div><div class="toast-msg"></div></div>' +
                 '<button class="toast-close">×</button><div class="toast-progress"></div>';
  el.querySelector('.toast-title').textContent = title;
  if (msg) el.querySelector('.toast-msg').textContent = msg;
  el.querySelector('.toast-progress').style.animationDuration = dur + 'ms';
  const close = () => { el.classList.add('removing'); el.addEventListener('animationend', () => el.remove(), { once: true }); };
  el.querySelector('.toast-close').addEventListener('click', close);
  document.getElementById('toast-container').appendChild(el);
  setTimeout(close, dur);
}

/* ── THEME ──────────────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? 'Dark' : 'Light';
  localStorage.setItem('portal_theme', isDark ? 'light' : 'dark');
}

(function boot() {
  if (localStorage.getItem('portal_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('theme-btn').textContent = 'Light';
  }
  renderModules();
  const liveCount = MODULES.filter(m => m.status === 'live').length;
  if (liveCount) toast(liveCount + (liveCount === 1 ? ' module' : ' modules') + ' available', 'More coming soon.');
})();
</script>
</body>
</html>
