<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Deutsch Lernen | Alle Lektionen</title>
    <!-- Use your existing CSS file -->
    <link href="https://roman-zajic.github.io/deutsch-portal/lessons/lesson.css" rel="stylesheet"/>
    <style>
        .lesson-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .lesson-list li {
            background: #f8fafc;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .lesson-list li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .lesson-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            text-decoration: none;
            color: #0f172a;
            font-weight: 600;
        }
        .lesson-date {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 400;
        }
        .loading {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a aria-label="Deutsch Lernen home" class="brand-icon" href="../">
        <!-- SVG Logo -->
        <svg fill="none" height="17" viewBox="0 0 31 22" width="24" xmlns="http://www.w3.org/2000/svg">
            <rect fill="#95DFDB" height="6" rx="1.5" width="9" x="0" y="0"></rect>
            <rect fill="#50C1C1" height="6" rx="1.5" width="9" x="11" y="0"></rect>
            <rect fill="#008282" height="6" rx="1.5" width="9" x="22" y="0"></rect>
            <rect fill="#95DFDB" height="6" rx="1.5" width="9" x="0" y="8"></rect>
            <rect fill="#50C1C1" height="6" rx="1.5" width="9" x="11" y="8"></rect>
            <rect fill="#008282" height="6" rx="1.5" width="9" x="22" y="8"></rect>
            <rect fill="#95DFDB" height="6" rx="1.5" width="9" x="0" y="16"></rect>
            <rect fill="#50C1C1" height="6" rx="1.5" width="9" x="11" y="16"></rect>
            <rect fill="#E1A01E" height="6" rx="1.5" width="9" x="22" y="16"></rect>
        </svg>
    </a>
    <div class="nav-pipe"></div>
    <span class="nav-brand-text">Lessons</span>
</nav>

<div class="wrap">
    <h1>Alle Lektionen</h1>
    <p>Wähle eine Lektion aus, um den Podcast zu hören und das Vokabular zu lernen.</p>
    
    <div id="loader" class="loading">Lektionen werden geladen...</div>
    <ul class="lesson-list" id="lesson-list"></ul>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("lessons.json")
            .then(response => {
                if (!response.ok) throw new Error("JSON not found");
                return response.json();
            })
            .then(lessons => {
                const list = document.getElementById("lesson-list");
                const loader = document.getElementById("loader");
                loader.style.display = "none";

                if (lessons.length === 0) {
                    list.innerHTML = "<li>No lessons available yet.</li>";
                    return;
                }

                lessons.forEach(lesson => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <a href="${lesson.filename}">
                            <span>${lesson.title}</span>
                            <span class="lesson-date">${lesson.date}</span>
                        </a>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(error => {
                document.getElementById("loader").textContent = "Fehler beim Laden der Lektionen.";
                console.error("Error fetching lessons:", error);
            });
    });
</script>
</body>
</html>
