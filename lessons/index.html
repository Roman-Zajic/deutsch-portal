<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily lesson — Deutsch Lernen</title>
<link rel="stylesheet" href="lesson.css">
<style>
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{
  display:block;text-decoration:none;background:var(--in);border:1px solid var(--border);
  border-radius:6px;padding:14px;transition:130ms}
.lcard:hover{border-color:var(--teal-700);background:#fff}
.lcard .ld{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--teal-700);margin-bottom:5px}
.lcard h3{font-size:1rem;text-transform:none;letter-spacing:0;color:var(--teal-900);
  margin:0 0 5px;line-height:1.35}
.lcard p{font-size:.82rem;color:var(--muted);margin:0}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
</style>
</head>
<body>
<nav class="navbar">
  <a class="brand-icon" href="../" aria-label="Deutsch Lernen home">
    <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="9" height="6" rx="1.5" fill="#95DFDB"></rect>
      <rect x="11" y="0" width="9" height="6" rx="1.5" fill="#50C1C1"></rect>
      <rect x="22" y="0" width="9" height="6" rx="1.5" fill="#008282"></rect>
      <rect x="0" y="8" width="9" height="6" rx="1.5" fill="#95DFDB"></rect>
      <rect x="11" y="8" width="9" height="6" rx="1.5" fill="#50C1C1"></rect>
      <rect x="22" y="8" width="9" height="6" rx="1.5" fill="#008282"></rect>
      <rect x="0" y="16" width="9" height="6" rx="1.5" fill="#95DFDB"></rect>
      <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"></rect>
      <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"></rect>
    </svg>
  </a>
  <div class="nav-pipe"></div>
  <a class="nav-brand-text" href="index.html">Lessons</a>
  <div class="nav-actions">
    <a class="icon-btn" href="../" title="Back to all modules" aria-label="Back to all modules">
      <svg class="line" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
  </div>
</nav>

<div class="wrap">
  <h1>Daily lesson</h1>
  <section style="margin-top: 20px;">
    <div class="lessons" id="lessons">
      <div class="empty">Lektionen werden geladen...</div>
    </div>
  </section>
  <p class="lead" style="color:var(--muted);font-size:.86rem;margin-top:25px;">
    A new lesson is published each night and sent at 04:00 Poland time.
  </p>
</div>

<footer><strong>Deutsch Lernen</strong> · Roman Zajic</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Determine path to lessons.json dynamically
    const jsonPath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + "lessons.json";

    fetch(jsonPath)
        .then(response => {
            if (!response.ok) throw new Error("Manifest nicht gefunden");
            return response.json();
        })
        .then(lessons => {
            const container = document.getElementById("lessons");
            
            container.innerHTML = "";
            
            if (!lessons || lessons.length === 0) {
                container.innerHTML = '<div class="empty">Noch keine Lektionen verfügbar.</div>';
                return;
            }

            // Sort lessons descending by date (newest first) just in case
            lessons.sort((a, b) => new Date(b.date) - new Date(a.date));

            lessons.forEach((lesson, index) => {
                // Calculate lesson number (assuming array sorted descending, first is highest number)
                const lessonNum = lessons.length - index;
                
                // Format date nicely (e.g., 2026-10-08 -> 8 Okt 2026)
                let formattedDate = lesson.date;
                try {
                    const [year, month, day] = lesson.date.split('-');
                    const months = ["", "Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
                    formattedDate = `${parseInt(day)} ${months[parseInt(month)]} ${year}`;
                } catch (e) {}

                const card = document.createElement("a");
                card.className = "lcard";
                card.href = lesson.filename;
                card.innerHTML = `
                    <div class="ld">Lesson ${lessonNum} · B1/B2 · ${formattedDate}</div>
                    <h3>${lesson.title}</h3>
                    <p>Aktuelle Nachrichten und Vokabeln von der Deutschen Welle</p>
                `;
                container.appendChild(card);
            });
        })
        .catch(error => {
            console.error("Error loading lessons:", error);
            document.getElementById("lessons").innerHTML = '<div class="empty">Fehler beim Laden der Lektionen.</div>';
        });
});
</script>
</body>
</html>
