<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vocabulary — Deutsch Lernen</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font:      "Segoe UI", system-ui, -apple-system, sans-serif;
  --teal-900:  #005A5A;
  --teal-700:  #008282;
  --teal-400:  #50C1C1;
  --teal-100:  #95DFDB;
  --amber:     #E1A01E;
  --red:       #C41E3A;
  --ink:       #012D2C;
  --text:      #005A5A;
  --muted:     #008282;
  --page:      #F0FAFA;
  --card:      #FFFFFF;
  --in:        #F0FAFA;
  --border:    #D0ECEB;
  --shadow:    0 1px 4px rgba(1,45,44,.10);
  --shadow-md: 0 4px 14px rgba(1,45,44,.12);
  --r:         8px;
  --nav-h:     48px;
  --wrap:      1040px;
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); font-size: 0.9375rem; color: var(--text); background: var(--page);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── NAVBAR ─────────────────────────────────────────── */
.navbar {
  display: flex; align-items: center; gap: 10px;
  height: var(--nav-h); padding: 0 16px;
  background: var(--teal-900); border-bottom: 1px solid rgba(149,223,219,.15);
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
}
.brand-icon { display: flex; align-items: center; flex-shrink: 0; }
.nav-pipe { width: 1px; height: 16px; background: rgba(149,223,219,.30); flex-shrink: 0; }
.nav-brand-text {
  font-size: 0.95rem; font-weight: 600; color: var(--teal-100);
  text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-stat {
  font-size: 0.7rem; font-weight: 600; color: var(--teal-100);
  padding: 4px 9px; border-radius: 12px; white-space: nowrap;
  background: rgba(149,223,219,.12); border: 1px solid rgba(149,223,219,.22);
}
.icon-btn {
  font-family: var(--font); font-size: 0.78rem; font-weight: 500;
  color: rgba(149,223,219,.85); background: rgba(149,223,219,.12);
  border: 1px solid rgba(149,223,219,.22); border-radius: 4px;
  padding: 5px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: 130ms; white-space: nowrap;
}
.icon-btn:hover { background: rgba(149,223,219,.22); color: var(--teal-100); }
.icon-btn svg { width: 13px; height: 13px; fill: currentColor; }

@media (max-width: 560px) {
  .nav-brand-text { font-size: 0.85rem; }
  .nav-stat { display: none; }
}

/* ── BUTTONS ────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font); font-size: 0.875rem; font-weight: 600;
  padding: 8px 16px; border-radius: 6px; border: 1px solid transparent;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 40px;
  transition: background 130ms, border-color 130ms, opacity 130ms;
}
.btn:active { opacity: .88; }
.btn-primary { background: var(--teal-900); color: #fff; border-color: var(--teal-900); }
.btn-primary:hover { background: var(--teal-700); border-color: var(--teal-700); }
.btn-secondary { background: transparent; color: var(--teal-900); border-color: var(--teal-900); }
.btn-secondary:hover { background: rgba(0,90,90,.05); }
.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover { background: #A01830; }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; min-height: 34px; }

/* The Add button sits on the dark teal navbar, where the normal
   teal-900 primary fill would be invisible against the background.
   Give it a light solid fill with a shadow so it reads as a button. */
.nav-add {
  background: var(--teal-100); color: var(--teal-900);
  border: 1px solid var(--teal-100); border-radius: 6px;
  padding: 7px 14px; font-size: 0.8rem; font-weight: 700;
  box-shadow: 0 1px 3px rgba(1,45,44,.30);
}
.nav-add:hover { background: #fff; border-color: #fff; }
.nav-add:active { transform: translateY(1px); }

/* ── WRAPPER / CARD ─────────────────────────────────── */
.wrap {
  width: 100%; max-width: var(--wrap); margin-inline: auto;
  padding: 14px 16px 40px; display: flex; flex-direction: column;
  flex: 1; min-height: 0; gap: 12px;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow); flex-shrink: 0;
}

/* ── SEGMENTED SWITCH ───────────────────────────────── */
.segmented {
  display: inline-flex; padding: 3px; gap: 3px; width: 100%;
  background: var(--in); border: 1px solid var(--border); border-radius: 6px;
}
.segmented button {
  flex: 1; font-family: var(--font); font-size: 0.75rem; font-weight: 600;
  color: var(--muted); background: transparent; border: none;
  padding: 7px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; transition: 130ms;
}
.segmented button.active { background: var(--teal-900); color: #fff; }
@media (max-width: 560px) { .segmented button { font-size: 0.7rem; padding: 8px 4px; } }

/* ── ACCORDION ──────────────────────────────────────── */
.accordion {
  border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; background: var(--card); box-shadow: var(--shadow); flex-shrink: 0;
}
.accordion-trigger {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 12px 16px; background: var(--card); border: none; cursor: pointer;
  text-align: left; font-family: var(--font); font-size: 0.85rem; font-weight: 600;
  color: var(--muted); transition: background 130ms; min-height: 44px;
}
.accordion-trigger:hover { background: var(--in); }
.accordion-trigger[aria-expanded="true"] { background: var(--in); color: var(--text); }
.accordion-chevron { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; transition: transform 200ms ease; }
.accordion-trigger[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); }
.accordion-body { display: none; padding: 0 16px 16px; background: var(--card); border-top: 1px solid var(--border); }
.accordion-body.open { display: block; }
.accordion-inner { padding-top: 14px; display: flex; flex-direction: column; gap: 16px; }

.section-label {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--teal-700); border-bottom: 1px dashed var(--border); padding-bottom: 5px; margin-bottom: 10px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 720px) { .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.field-label {
  font-size: 0.7rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; display: block;
}
.input {
  font-family: var(--font); font-size: 0.9rem; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 9px 12px; outline: none; width: 100%; min-height: 42px;
  transition: border-color 130ms, box-shadow 130ms;
}
select.input { cursor: pointer; }
.input::placeholder { color: #7A9E9E; }
.input:hover, .input:focus { border-color: var(--teal-700); }
.input:focus { box-shadow: 0 0 0 3px rgba(0,130,130,.15); }

/* ── MULTI-SELECT ───────────────────────────────────── */
.multi-select { position: relative; font-size: 0.9rem; }
.multi-select-header {
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 9px 12px; cursor: pointer; user-select: none; color: var(--text);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 42px;
}
.multi-select-header::after { content: "▼"; font-size: 0.6rem; color: var(--muted); }
.multi-select-options {
  position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: var(--shadow-md); z-index: 10; display: none; flex-direction: column;
  max-height: 240px; overflow-y: auto;
}
.multi-select.open .multi-select-options { display: flex; }
.multi-select-options label {
  padding: 10px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text);
}
.multi-select-options label:hover { background: var(--in); }
.multi-select-options input { accent-color: var(--teal-700); width: 17px; height: 17px; margin: 0; }

/* ── VOCAB GRID ─────────────────────────────────────── */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 560px) { .vocab-grid { grid-template-columns: 1fr; } }

.vocab-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color 130ms, box-shadow 130ms;
}
.vocab-card:hover { border-color: var(--teal-400); box-shadow: var(--shadow-md); }

/* Icons get their own row above the text, so the word and meaning
   use the full card width instead of sharing it with the icons. */
.card-head { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 4px; }
.word-wrap { width: 100%; min-width: 0; }
.primary-word {
  font-size: 1.05rem; font-weight: 700; color: var(--teal-900);
  line-height: 1.25; margin-bottom: 3px; word-break: break-word; overflow-wrap: anywhere;
}
.card-art { color: var(--amber); margin-right: 5px; font-weight: 700; }
.secondary-word {
  font-size: 0.9rem; font-weight: 500; color: var(--muted);
  position: relative; line-height: 1.35; word-break: break-word; overflow-wrap: anywhere;
}

.covered {
  color: transparent !important; background: var(--in);
  border: 1px dashed var(--border); border-left: 4px solid var(--amber);
  border-radius: 4px; cursor: pointer; user-select: none;
  display: inline-block; padding: 3px 8px; min-width: 110px;
}
.covered .card-art { color: transparent !important; }
.covered::after {
  content: "Reveal"; color: var(--amber); font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content;
}

.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.badge {
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 2px 8px; border-radius: 12px; background: rgba(0,130,130,.10); color: var(--teal-700);
}
.badge.level { background: rgba(225,160,30,.15); color: var(--amber); }
.badge.notes { background: var(--in); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }

.card-details {
  display: none; flex-direction: column; gap: 8px; margin-top: 8px;
  border-top: 1px dashed var(--border); padding-top: 10px; animation: fadeIn 200ms ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.card-meta {
  font-size: 0.75rem; color: var(--muted); background: var(--in);
  padding: 5px 9px; border-radius: 4px; border: 1px solid var(--border);
}
.card-examples { font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px; }
.example-item { position: relative; padding-left: 12px; font-style: italic; color: var(--text); }
.example-item::before { content: "•"; position: absolute; left: 0; color: var(--teal-400); }

.card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.card-icon {
  background: none; border: none; color: var(--teal-700); cursor: pointer;
  padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  transition: background 150ms; min-width: 34px; min-height: 34px;
}
.card-icon:hover { background: rgba(0,130,130,.10); }
.card-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card-icon.danger { color: var(--red); }
.expand-svg { transition: transform 200ms; }
.expanded .expand-svg { transform: rotate(180deg); }

.empty-state { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 36px 16px; }

/* ── ADD BAR ────────────────────────────────────────── */
.add-bar { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.add-bar .input { flex: 1; min-width: 150px; }

/* ── MODAL ──────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(1,45,44,.6);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 200ms; padding: 16px;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 20px; width: 100%; max-width: 460px; max-height: 88dvh; overflow-y: auto;
  box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 14px;
  transform: translateY(8px); transition: transform 200ms;
}
.modal-overlay.open .modal-card { transform: translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 1rem; font-weight: 700; color: var(--teal-900);
  border-bottom: 1px solid var(--border); padding-bottom: 10px;
}
.modal-close {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 1.4rem; line-height: 1; padding: 4px 8px;
}
.modal-close:hover { color: var(--text); }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
  border-top: 1px solid var(--border); padding-top: 12px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.textarea {
  font-family: var(--font); font-size: 0.85rem; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; outline: none; width: 100%; min-height: 88px; resize: vertical; line-height: 1.55;
}
.textarea:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }
.notice {
  font-size: .78rem; color: var(--muted); line-height: 1.55;
  background: var(--in); border: 1px solid var(--border);
  border-left: 4px solid var(--teal-400); border-radius: 6px; padding: 10px 12px;
}
@media (max-width: 560px) {
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal-card { max-width: none; border-radius: var(--r) var(--r) 0 0; max-height: 92dvh; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .modal-footer .btn { flex: 1; }
}

/* ── TOASTER ────────────────────────────────────────── */
#toast-container {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; align-items: center;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px; width: 100%; max-width: 360px;
  padding: 11px 14px; border-radius: 6px; font-size: 0.8125rem; line-height: 1.45;
  box-shadow: 0 4px 18px rgba(1,45,44,.18); pointer-events: all;
  position: relative; overflow: hidden;
  animation: toast-in 200ms cubic-bezier(.22,1,.36,1) forwards;
}
.toast.removing { animation: toast-out 180ms ease-in forwards; }
@keyframes toast-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { from { opacity: 1; max-height: 70px; } to { opacity: 0; max-height: 0; margin-bottom: -8px; } }
.toast-success { background: #005A5A; color: #fff; }
.toast-error   { background: #C41E3A; color: #fff; }
.toast-warning { background: #7A5000; color: #fff; }
.toast-info    { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-weight: 600; font-size: 0.8125rem; }
.toast-msg   { font-size: 0.75rem; opacity: .85; margin-top: 1px; }
.toast-close { background: none; border: none; cursor: pointer; color: inherit; opacity: .6; font-size: 1rem; line-height: 1; padding: 2px 4px; }
.toast-progress { position: absolute; bottom: 0; left: 0; height: 2px; background: rgba(255,255,255,.35); animation: toast-shrink linear forwards; }
.toast-info .toast-progress { background: var(--teal-400); }
@keyframes toast-shrink { from { width: 100%; } to { width: 0%; } }

/* ── GERMAN KEYBOARD ────────────────────────────────── */
/* Lives in the Add/Edit modal beside the German word field, and opens
   upward so it never covers the form. */
.input-with-kbd { position: relative; display: flex; gap: 6px; }
.input-with-kbd .input { flex: 1; min-width: 0; }
.de-kbd-widget { position: relative; flex-shrink: 0; }
.de-kbd-panel {
  display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 6px; box-shadow: var(--shadow-md);
  gap: 4px; width: 152px; flex-wrap: wrap; justify-content: center;
  z-index: 30; animation: fadeIn 200ms ease;
}
.de-kbd-panel.active { display: flex; }
.de-char-btn {
  background: var(--in); border: 1px solid var(--border); color: var(--teal-900);
  font-size: 0.95rem; font-weight: 600; border-radius: 4px;
  width: 34px; height: 34px; cursor: pointer; transition: 150ms;
}
.de-char-btn:hover { background: rgba(0,130,130,.10); border-color: var(--teal-400); }
.de-kbd-toggle {
  background: var(--teal-900); color: #fff; border: 1px solid var(--teal-700);
  border-radius: 6px; width: 44px; height: 40px; cursor: pointer;
  font-size: 1rem; font-weight: 700; transition: 130ms; flex-shrink: 0;
}
.de-kbd-toggle:hover { background: var(--teal-700); }

/* ── STATUS BAR ──────────────────────────────────────── */
/* Sits just above the footer and carries the word count plus the
   sync state ("saved", "unsaved", "offline"). */
.status-bar {
  width: 100%; max-width: var(--wrap); margin-inline: auto;
  padding: 7px 16px; text-align: center;
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
  background: var(--page); border-top: 1px solid var(--border);
}
.status-bar.error { color: #C41E3A; }

/* ── FOOTER ─────────────────────────────────────────── */
/* Sticky to the bottom of the viewport, so it stays visible while
   the word list scrolls. */
.footer {
  position: sticky; bottom: 0; z-index: 50;
  width: 100%; max-width: var(--wrap); margin-inline: auto;
  border-top: 1px solid var(--border); padding: 10px 16px;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
  font-size: 0.8rem; color: var(--muted); flex-shrink: 0;
  background: var(--page);
}
.footer strong { color: var(--text); font-weight: 600; }
.footer-dot { margin: 0 10px; color: var(--border); }
</style>
</head>
<body>

<div id="toast-container"></div>

<nav class="navbar">
  <a class="brand-icon" href="../../" aria-label="Back to portal">
    <svg width="22" height="16" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
    </svg>
  </a>
  <div class="nav-pipe"></div>
  <a class="nav-brand-text" href="../../">Vocabulary</a>
  <div class="nav-actions">
    <button class="btn nav-add" onclick="window.openModal()" title="Add a word">+ Add word</button>
  </div>
</nav>

<div class="wrap">

  <div class="accordion">
    <button class="accordion-trigger" id="filtersToggle" aria-expanded="false" onclick="window.toggleAccordion('filtersToggle','filtersBody')">
      <span>Mode, Filters &amp; Lookup</span>
      <svg class="accordion-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 9 12 14 7"/></svg>
    </button>
    <div class="accordion-body" id="filtersBody">
      <div class="accordion-inner">

        <div>
          <div class="section-label">Mode</div>
          <div class="segmented" id="modeSwitch">
            <button data-mode="review" onclick="window.setMode('review')">Review</button>
            <button data-mode="de-en"  onclick="window.setMode('de-en')">DE → EN</button>
            <button data-mode="en-de"  onclick="window.setMode('en-de')">EN → DE</button>
          </div>
        </div>

        <div>
          <div class="section-label">Filters</div>
          <div class="grid-3">
            <div>
              <label class="field-label">Search</label>
              <input type="text" id="searchInput" class="input" placeholder="Word or meaning…" oninput="window.renderGrid()">
            </div>
            <div>
              <label class="field-label">Part of Speech</label>

<script>
/* ── DATA SOURCE ────────────────────────────────────────
   Words live in this repository as JSON. Reads are anonymous
   (the repo is public), so the app works with no token at
   all; a token is only needed to write changes back.

   A token is NEVER embedded in this file — this page is
   public and anything hardcoded here is readable by anyone.
───────────────────────────────────────────────────────── */
const REPO      = "Roman-Zajic/deutsch-portal";
const BRANCH    = "main";
const DATA_PATH = "data/vocabulary.json";
const CFG_KEY   = "vs_cfg";     // shared by every page in the portal
const DRAFT_KEY = "vs_draft";   // unsaved edits, so they survive a reload
const MODE_KEY  = "vs_mode";

let GH_TOKEN = "";
let GH_REPO = REPO, GH_BRANCH = BRANCH, GH_PATH = DATA_PATH;
let dirty = false;

window.vocabList = [];
window.currentMode = "review";
window.lastFocusedInput = null;

function hasToken() { return !!(GH_TOKEN && GH_REPO && GH_BRANCH && GH_PATH); }
function rawUrl() { return `https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/${GH_PATH}`; }

/* ── LOCAL DRAFT ────────────────────────────────────────
   Edits are kept in localStorage immediately, whether or not a
   GitHub token is set. Without this, a delete or an add would
   vanish on reload whenever the page could not reach GitHub.
───────────────────────────────────────────────────────── */
function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: Date.now(), list: window.vocabList }));
  } catch (e) {}
}
function readDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    return d && Array.isArray(d.list) ? d : null;
  } catch (e) { return null; }
}
function clearDraft() { localStorage.removeItem(DRAFT_KEY); }

function loadCfg() {
  try {
    const s = JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
    GH_TOKEN = s.token || ""; GH_REPO = s.repo || REPO;
    GH_BRANCH = s.branch || BRANCH; GH_PATH = s.path || DATA_PATH;
  } catch (e) {}
}
function saveCfg(c) {
  GH_TOKEN = c.token; GH_REPO = c.repo; GH_BRANCH = c.branch; GH_PATH = c.path;
  localStorage.setItem(CFG_KEY, JSON.stringify({ token: c.token, repo: c.repo, branch: c.branch, path: c.path }));
}

/* ── TOASTER ────────────────────────────────────────── */
const TOAST_ICONS = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
window.toast = function(type, title, msg, duration) {
  const dur = duration || 4000;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (TOAST_ICONS[type] ? type : 'info');
  el.innerHTML = '<div class="toast-body"><div class="toast-title"></div><div class="toast-msg"></div></div>' +
                 '<button class="toast-close">×</button><div class="toast-progress"></div>';
  el.querySelector('.toast-title').textContent = (TOAST_ICONS[type] ? TOAST_ICONS[type] + ' ' : '') + title;
  const m = el.querySelector('.toast-msg');
  if (msg) m.textContent = msg; else m.remove();
  const close = () => { el.classList.add('removing'); el.addEventListener('animationend', () => el.remove(), { once: true }); };
  el.querySelector('.toast-close').addEventListener('click', close);
  el.querySelector('.toast-progress').style.animationDuration = dur + 'ms';
  document.getElementById('toast-container').appendChild(el);
  setTimeout(close, dur);
};

/* ── UI ──────────────────────────────────────────────── */
window.toggleAccordion = function(btnId, bodyId) {
  const btn = document.getElementById(btnId);
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  document.getElementById(bodyId).classList.toggle('open', !open);
};

window.toggleMultiSelect = function(id) {
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.multi-select').forEach(m => m.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
};
document.addEventListener('click', e => {
  if (!e.target.closest('.multi-select')) document.querySelectorAll('.multi-select').forEach(m => m.classList.remove('open'));
});

window.setMode = function(mode) {
  window.currentMode = mode;
  localStorage.setItem(MODE_KEY, mode);
  document.querySelectorAll('#modeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  window.renderGrid();
};

window.updateFilters = function() {
  const pos = [...document.querySelectorAll('.pos-cb:checked')].map(c => c.value);
  const lvl = [...document.querySelectorAll('.lvl-cb:checked')].map(c => c.value);
  document.getElementById('posFilterText').innerText = pos.length === 0 ? "All" : pos.length + " selected";
  document.getElementById('lvlFilterText').innerText = lvl.length === 0 ? "All" : lvl.length + " selected";
  window.renderGrid();
};

function setStatus(msg, isError) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}

/* ── LOAD (anonymous — no token required) ────────────── */
/* Read the word list.

   IMPORTANT: raw.githubusercontent.com caches for up to 5 minutes, so a
   delete or edit can look like it bounced back for several minutes even
   though the write to GitHub succeeded. When a token is available we read
   through the Contents API instead, which is never stale; the raw CDN is
   only used for the anonymous, token-less case.
───────────────────────────────────────────────────────── */
async function fetchWords() {
  if (hasToken()) {
    // NOTE: no Cache-Control header here. It is not a CORS-safelisted
    // request header, so adding it makes GitHub reject the preflight
    // and the whole read fails. The ?t= cache-buster is enough.
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}&t=${Date.now()}`, {
      headers: { 'Authorization': `Bearer ${GH_TOKEN}`, 'Accept': 'application/vnd.github+json' }
    });
    if (r.ok) {
      const d = await r.json();
      const bytes = Uint8Array.from(atob(d.content.replace(/\n/g, '')), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    throw new Error('API ' + r.status);
  }
  const res = await fetch(rawUrl() + '?t=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return JSON.parse(await res.text());
}

async function loadData() {
  setStatus("Loading…");
  try {
    const remote = await fetchWords();
    if (!Array.isArray(remote)) throw new Error('not an array');

    // Unsaved local edits win over the repo copy, so nothing is lost.
    const draft = readDraft();
    const source = draft ? draft.list : remote;

    window.vocabList = source.map(it => ({
      id: it.id || String(Date.now() + Math.floor(Math.random() * 1000)),
      word: it.word || '',
      translation: it.translation || '',
      partOfSpeech: it.partOfSpeech || 'Other',
      article: it.article || '',
      level: it.level || 'C2',
      plural: it.plural || '',
      notes: it.notes || '',
      examples: Array.isArray(it.examples) ? it.examples : []
    }));

    dirty = !!draft;
    window.renderGrid();
    const n = window.vocabList.length;
    if (draft) setStatus(n + ' words · unsaved');
    else if (!hasToken()) setStatus(n + ' words · read-only (no token)');
    else setStatus(n + ' words · synced');
  } catch (e) {
    const draft = readDraft();
    if (draft) {
      window.vocabList = draft.list;
      dirty = true;
      window.renderGrid();
      setStatus(window.vocabList.length + ' words · offline');
      window.toast('warning', 'Offline', 'Showing your saved edits on this device.');
    } else {
      window.renderGrid();
      setStatus("Load failed", true);
      window.toast('error', 'Could not load words', e.message);
    }
  }
}

/* ── SAVE (needs token) ──────────────────────────────── */
async function saveToGitHub(silent) {
  if (!hasToken()) {
    // No token: the edits are already safe in localStorage. Just say so.
    if (!silent) {
      window.toast('info', 'Saved on this device', 'Set a token on the home page to also save to GitHub.');
    }
    return false;
  }

  const url = `https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`;
  const headers = {
    'Authorization': `Bearer ${GH_TOKEN}`,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };

  // The Contents API is compare-and-swap: it rejects the write unless the
  // sha matches the file's current state. Re-reading the sha on every
  // attempt is what makes back-to-back saves (delete, then edit) work
  // instead of failing with 409.
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const head = await fetch(`${url}?ref=${GH_BRANCH}&t=${Date.now()}`, {
        headers: { 'Authorization': `Bearer ${GH_TOKEN}`, 'Accept': 'application/vnd.github+json' }
      });
      if (!head.ok) throw new Error('HEAD ' + head.status);
      const current = (await head.json()).sha;

      const bytes = new TextEncoder().encode(JSON.stringify(window.vocabList, null, 2));
      const b64 = btoa(Array.from(bytes, b => String.fromCodePoint(b)).join(''));
      const payload = { message: "Update vocabulary via Vocabulary module", content: b64, branch: GH_BRANCH, sha: current };

      const res = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(payload) });

      if (res.ok) {
        dirty = false;
        clearDraft();
        setStatus(window.vocabList.length + ' words · saved');
        if (!silent) window.toast('success', 'Saved', 'Committed to GitHub.');
        return true;
      }
      if (res.status === 409) {
        // Someone (or another tab) wrote in between; re-read sha and retry.
        await new Promise(r => setTimeout(r, 400 * attempt));
        continue;
      }
      if (res.status === 401 || res.status === 403) {
        window.toast('error', 'Token rejected', 'It is invalid or lacks Contents write access.');
      } else {
        window.toast('error', 'Save failed', 'GitHub returned ' + res.status + '.');
      }
      break;
    } catch (e) {
      window.toast('error', 'Network error', 'Could not reach GitHub — your edits are safe on this device.');
      break;
    }
  }
  return false;
}

/* Settings live on the portal home page, so one token serves every
   module. This module only reads what that page stored. */
window.gotoSettings = function() {
  window.location.href = '../../#settings';
};

/* ── CARD ACTIONS ────────────────────────────────────── */
window.speakText = function(text, event) {
  if (event) event.stopPropagation();
  try {
    if (!('speechSynthesis' in window)) return window.toast('warning', 'No TTS', 'Not available in this browser.');
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; window.speechSynthesis.speak(u);
  } catch (e) { window.toast('error', 'TTS error', e.message); }
};
window.revealAnswer = function(el) { el.classList.remove('covered'); };
window.toggleDetails = function(id) {
  const d = document.getElementById('details-' + id);
  const b = document.getElementById('btn-' + id);
  const open = d.style.display === 'flex';
  d.style.display = open ? 'none' : 'flex';
  b.classList.toggle('expanded', !open);
};

/* ── RENDER ──────────────────────────────────────────── */
const ICONS = {
  speak:  `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,
  edit:   `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
  del:    `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
  expand: `<svg class="expand-svg" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>`
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

window.renderGrid = function() {
  const grid = document.getElementById('vocab-grid');
  grid.innerHTML = '';

  const term = document.getElementById('searchInput').value.toLowerCase().trim();
  const pos = [...document.querySelectorAll('.pos-cb:checked')].map(c => c.value);
  const lvl = [...document.querySelectorAll('.lvl-cb:checked')].map(c => c.value);
  const mode = window.currentMode;

  const filtered = window.vocabList.filter(item => {
    const w = (item.word || '').toLowerCase(), t = (item.translation || '').toLowerCase();
    return (!term || w.includes(term) || t.includes(term))
      && (pos.length === 0 || pos.includes(item.partOfSpeech))
      && (lvl.length === 0 || lvl.includes(item.level));
  });

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'vocab-card';

    // Article is its own field; put a space after it so it doesn't run into the word.
    const german = (item.article ? `<span class="card-art">${esc(item.article)}</span> ` : '') + esc(item.word);
    const english = esc(item.translation);

    let primary = german, secondary = english, cls = 'secondary-word';
    if (mode === 'en-de') { primary = english; secondary = german; cls += ' covered'; }
    else if (mode === 'de-en') { cls += ' covered'; }

    let meta = '';
    if (item.plural) meta += `<div class="card-meta"><strong>Plural:</strong> ${esc(item.plural)}</div>`;

    let ex = '';
    if (item.examples.length) {
      ex = '<div class="card-examples">' + item.examples
        .filter(e => e && String(e).trim())
        .map(e => `<div class="example-item">${esc(e)}</div>`).join('') + '</div>';
    }

    const spoken = ((item.article ? item.article + ' ' : '') + item.word).replace(/'/g, "\\'");

    card.innerHTML =
      '<div class="card-head">' +
        '<div class="card-actions">' +
          `<button class="card-icon" onclick="window.speakText('${spoken}', event)" title="Pronounce">${ICONS.speak}</button>` +
          `<button class="card-icon" onclick="window.openEditModal('${esc(item.id)}')" title="Edit">${ICONS.edit}</button>` +
          `<button class="card-icon danger" onclick="window.deleteWord('${esc(item.id)}')" title="Delete">${ICONS.del}</button>` +
          `<button class="card-icon" id="btn-${esc(item.id)}" onclick="window.toggleDetails('${esc(item.id)}')" title="Details">${ICONS.expand}</button>` +
        '</div>' +
      '</div>' +
      '<div class="word-wrap">' +
        `<div class="primary-word">${primary}</div>` +
        `<div class="${cls}" onclick="window.revealAnswer(this)">${secondary}</div>` +
      '</div>' +
      `<div class="card-details" id="details-${esc(item.id)}">` +
        '<div class="badges">' +
          `<span class="badge">${esc(item.partOfSpeech)}</span>` +
          (item.level ? `<span class="badge level">${esc(item.level)}</span>` : '') +
          (item.notes ? `<span class="badge notes">${esc(item.notes)}</span>` : '') +
        '</div>' + meta + ex +
      '</div>';
    grid.appendChild(card);
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">' + (window.vocabList.length
      ? 'No words match your filters.'
      : 'No words yet — use <strong>+ Add a word</strong> in the navigation bar.') + '</div>';
  }
};

/* ── CRUD ────────────────────────────────────────────── */
window.openModal = function(data) {
  // An entry with no id is a new word, even though fields are prefilled.
  const isEdit = !!(data && data.id);
  document.getElementById('modalTitle').innerText = isEdit ? "Edit Word" : "Add Word";
  document.getElementById('editId').value          = data ? data.id : "";
  document.getElementById('editWord').value        = data ? data.word : "";
  document.getElementById('editTranslation').value = data ? data.translation : "";
  document.getElementById('editPoS').value          = data ? data.partOfSpeech : 'Noun';
  document.getElementById('editArticle').value      = data ? data.article : '';
  document.getElementById('editLevel').value        = data ? data.level : 'C2';
  document.getElementById('editPlural').value       = data ? data.plural : '';
  document.getElementById('editNotes').value        = data ? (data.notes || '') : '';
  document.getElementById('editExamples').value     = data ? data.examples.join('\n') : '';
  document.getElementById('wordModal').classList.add('open');
};
window.closeModal = function() {
  document.getElementById('wordModal').classList.remove('open');
  closeAllKbd();
};
window.openEditModal = function(id) {
  const w = window.vocabList.find(x => x.id === id);
  if (w) window.openModal(w);
};
window.deleteWord = function(id) {
  const w = window.vocabList.find(x => x.id === id);
  if (!confirm('Delete "' + (w ? w.word : 'this word') + '"?')) return;
  window.vocabList = window.vocabList.filter(x => x.id !== id);
  dirty = true;
  saveDraft();                 // persist locally first, then try GitHub
  window.renderGrid();
  setStatus(window.vocabList.length + ' words · unsaved');
  window.toast('success', 'Deleted', w ? w.word : '');
  saveToGitHub(true);          // silent: no dialog if there is no token
};
window.saveWord = function() {
  const id = document.getElementById('editId').value || String(Date.now());
  const d = {
    id,
    word: document.getElementById('editWord').value.trim(),
    translation: document.getElementById('editTranslation').value.trim(),
    partOfSpeech: document.getElementById('editPoS').value,
    article: document.getElementById('editArticle').value,
    level: document.getElementById('editLevel').value,
    plural: document.getElementById('editPlural').value.trim(),
    notes: document.getElementById('editNotes').value.trim(),
    examples: document.getElementById('editExamples').value.split('\n').map(s => s.trim()).filter(Boolean)
  };
  if (!d.word) return window.toast('warning', 'Word required', 'Enter the German word.');
  const i = window.vocabList.findIndex(x => x.id === id);
  if (i >= 0) window.vocabList[i] = d; else window.vocabList.unshift(d);
  dirty = true;
  saveDraft();
  window.closeModal();
  window.renderGrid();
  setStatus(window.vocabList.length + ' words · unsaved');
  window.toast('success', i >= 0 ? 'Updated' : 'Added', d.word);
  saveToGitHub(true);
};

/* Throw away local edits and go back to what GitHub has. */
window.discardDraft = function() {
  if (!confirm('Discard unsaved changes on this device and reload the saved list?')) return;
  clearDraft();
  dirty = false;
  loadData();
};

/* ── GERMAN KEYBOARD ─────────────────────────────────── */
document.addEventListener('focusin', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') window.lastFocusedInput = e.target;
});
window.toggleDeKbd = function(e, panelId) {
  if (e) e.stopPropagation();
  document.getElementById(panelId).classList.toggle('active');
};
function closeAllKbd() {
  document.querySelectorAll('.de-kbd-panel').forEach(p => p.classList.remove('active'));
}
// Clicking anywhere outside a panel closes it.
document.addEventListener('click', e => {
  if (e.target.closest('.de-kbd-widget')) return;
  closeAllKbd();
});
window.insertChar = function(e, char) {
  e.preventDefault();
  const input = window.lastFocusedInput;
  if (!input) return;
  const s = input.selectionStart, en = input.selectionEnd;
  input.value = input.value.substring(0, s) + char + input.value.substring(en);
  input.selectionStart = input.selectionEnd = s + char.length;
  input.dispatchEvent(new Event('input', { bubbles: true }));
};

window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ── BOOT ────────────────────────────────────────────── */
(function boot() {
  loadCfg();
  const m = localStorage.getItem(MODE_KEY);
  window.setMode(['review', 'de-en', 'en-de'].includes(m) ? m : 'review');
  document.getElementById('newWordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.updateFilters();
  });
  // Warn before losing unsaved edits.
  window.addEventListener('beforeunload', e => {
    if (dirty && readDraft()) { e.preventDefault(); e.returnValue = ''; }
  });
  loadData();
})();
</script>
</body>
